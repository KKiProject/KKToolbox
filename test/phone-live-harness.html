<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KKToolbox Live Harness</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background: #ddd9e8; margin: 0; min-height: 100vh; padding: 1.5rem; }
        .memory-augment-phone-device { height: 44rem; margin: auto; }
    </style>
</head>
<body>
    <section class="memory-augment-phone-device">
        <div class="memory-augment-phone-screen">
            <header class="memory-augment-phone-statusbar"><span>09:41</span><span></span><span>▮ ◉</span></header>
            <main class="memory-augment-phone-app-page">
                <header class="memory-augment-phone-app-header">
                    <button type="button"><i class="fa-solid fa-chevron-left"></i></button>
                    <strong>直播</strong><span></span>
                </header>
                <div class="memory-augment-phone-app-content"></div>
            </main>
        </div>
    </section>
    <script type="module">
        import { createPhoneLiveController } from '../phone-live.js';
        const settings = { phone: { live: {} } };
        const controller = createPhoneLiveController({
            document,
            settings,
            saveSettings: () => { globalThis.savedLiveSettings = structuredClone(settings.phone.live); },
        });
        await controller.open(document.querySelector('.memory-augment-phone-app-content'));
        globalThis.liveHarness = { controller, settings };
    </script>
</body>
</html>
